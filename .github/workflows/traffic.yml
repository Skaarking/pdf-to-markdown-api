name: traffic-snapshot
on:
  schedule: [{ cron: "40 11 * * *" }]
  workflow_dispatch: {}
permissions: { contents: write }
jobs:
  snap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          mkdir -p .stats
          v=$(gh api repos/${{ github.repository }}/traffic/views) && r=$(gh api repos/${{ github.repository }}/traffic/popular/referrers) || { echo "traffic API not permitted for GITHUB_TOKEN"; exit 1; }
          echo "{\"at\":\"$(date -u +%FT%TZ)\",\"views\":$v,\"referrers\":$r}" | jq -c . >> .stats/traffic.jsonl
          git config user.name "stats-bot"; git config user.email "stats-bot@users.noreply.github.com"
          git add .stats && git commit -qm "traffic snapshot" && git push -q || true
